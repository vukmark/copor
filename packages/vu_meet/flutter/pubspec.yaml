name: copor_vu_meet
description: "Copor VuMeet module (Flutter): chat, calls, CallKit"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  collection: ^1.19.0
  dartz: ^0.10.1
  dio: ^5.7.0
  equatable: ^2.0.5
  firebase_messaging: ^16.0.0
  flutter_bloc: ^9.0.0
  flutter_callkit_incoming: 3.0.0
  flutter_hooks: ^0.21.3
  flutter_local_notifications: ^19.3.0
  get_it: ^9.1.1
  go_router: ^17.0.0
  jitsi_meet_flutter_sdk: 12.1.3
  json_annotation: ^4.9.0
  permission_handler: ^12.0.1
  provider: ^6.0.0
  retrofit: ^4.4.1
  shared_preferences: ^2.3.2
  stream_transform: any
  url_launcher: ^6.2.6
  vibration: ^3.1.3
  copor_core:
    path: ../../core/flutter
  copor_scaffold:
    path: ../../copor_scaffold
  copor_theme:
    path: ../../copor_theme

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  retrofit_generator: ^10.0.2
